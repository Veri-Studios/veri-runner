[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veri-runner"
version = "0.1.0"
description = "The training runtime that executes Veri jobs on GPU workers: trajectory capture, harness rollouts, and TRL method dispatch"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The runtime's heavy dependencies (torch, trl, transformers, datasets, vllm)
# are provided by the worker image and imported lazily per training method.
# The package itself is import-clean on plain Python, which is what lets the
# unit tests and static analysis run without a GPU stack.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["veri_runner"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
